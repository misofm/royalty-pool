[package]
name = "royalty-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "royalty-sim"
path = "src/main.rs"

[lib]
name = "royalty_sim"
path = "src/lib.rs"

[dependencies]
primitive-types = { version = "0.13", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"
num-rational = "0.4"
num-bigint = "0.4"
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"
